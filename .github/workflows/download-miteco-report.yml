name: Descargar parte diario de MITECO

on:
  workflow_dispatch:
  schedule:
    - cron: "37 12 * * *"
      timezone: "Europe/Madrid"
    - cron: "17 18 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: download-miteco-report
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias del descargador
        run: python -m pip install "httpx>=0.27,<1.0" "beautifulsoup4>=4.12,<5.0" "pymupdf>=1.24,<2.0"

      - name: Descargar y validar el parte
        run: python src/miteco_rag/download_miteco_report.py

      - name: Guardar cambios en el repositorio
        shell: bash
        run: |
          git add data/raw/miteco
          if git diff --cached --quiet; then
            echo "El parte ya estaba archivado; no hay cambios que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "datos: archivar parte diario de MITECO"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
